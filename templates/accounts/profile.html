{% extends "base.html" %}

{% block title %}
Profile
{% endblock %}

{% block content %}

<h1>My Profile</h1>

<p>
    Username:
    {{ user.username }}
</p>

<p>
    Email:
    {{ user.email }}
</p>

<p>
    First Name:
    {{ user.first_name }}
</p>

<p>
    Last Name:
    {{ user.last_name }}
</p>

<p>
    Date Joined:
    {{ user.date_joined }}
</p>

{% endblock %}
